plugins {
    id 'com.android.application'
}

android {
    namespace "camp.poor.knucklebomb"
    compileSdk 34

    defaultConfig {
        applicationId "camp.poor.knucklebomb"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
